[workspace]
members = ["crates/ic-query", "crates/ic-query-cli"]
resolver = "3"

[workspace.package]
version = "0.58.0"
edition = "2024"
rust-version = "1.91.0"
license = "MIT"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]
homepage = "https://github.com/dragginzgame/ic-query"
repository = "https://github.com/dragginzgame/ic-query"

[workspace.dependencies]
candid = { version = "0.10", default-features = false }
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
ciborium = "0.2"
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3"
ic-agent = { version = "0.49.2", default-features = false }
ic-build = "0.7"
ic-cdk = "0.20.2"
ic-certification = "3.0"
ic-host-artifacts = { version = "0.21", default-features = false }
ic-host-fs = { version = "0.21", default-features = false }
# IC Build 0.7 exposes Host 0.20 CleanupPolicy to the Governance harness.
ic-host-process = { version = "0.20", default-features = false }
ic-host-text = "0.21"
ic-host-tools = { version = "0.21", default-features = false }
ic-query = { path = "crates/ic-query", version = "0.58.0", default-features = false }
ic-testkit = "0.47"
ic-testkit-candid = "0.47"
icrc-ledger-types = "0.2"
libc = "0.2"
prost = "0.14.3"
reqwest = { version = "0.13.4", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_cbor = "0.11.2"
serde_json = "1.0"
sha2 = "0.10.9"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = "1.52.3"
url = "2.5.8"
wat = "1"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# always warn
missing_const_for_fn = "warn"
must_use_candidate = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
use_self = "warn"

# always allow
doc_markdown = "allow"
empty_line_after_doc_comments = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
