[workspace]
members = [
    # Production packages
    "crates/ic-query",
    "crates/ic-query-cli",
    # Tests and tooling only
    "crates/ic-query-testkit",
    "crates/ic-query-text",
]
default-members = ["crates/ic-query", "crates/ic-query-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]
homepage = "https://github.com/dragginzgame/ic-query"
repository = "https://github.com/dragginzgame/ic-query"

[workspace.dependencies]
# Query
# Changelog : releases/query/CHANGELOG.md
ic-query = { path = "crates/ic-query", version = "0.89.0", default-features = false }
ic-query-testkit = { path = "crates/ic-query-testkit", version = "0.89.0" }

# CLI and text presentation
# Changelog : releases/cli/CHANGELOG.md
ic-query-cli = { path = "crates/ic-query-cli", version = "0.89.0" }
ic-query-text = { path = "crates/ic-query-text", version = "0.89.0", default-features = false }

# Production dependencies
clap = { version = "4.6.1", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await", "async-await-macro"] }
ic-host-artifacts = { version = "0.74.2", default-features = false }
ic-host-fs = { version = "0.74.2", default-features = false }
ic-host-http = { version = "0.74.2", default-features = false }
ic-host-text = "0.74.1"
ic-host-tools = { version = "0.79.0", default-features = false }
ic-platform = { version = "0.19.0", default-features = false, features = ["candid"] }
prost = "0.14.3"
reqwest = { version = "0.13.4", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = "1.52.3"
url = "2.5.8"

# Tests and tooling only
futures = { version = "0.3", default-features = false }
ic-build = "0.74.1"
ic-host-process = { version = "0.74.2", default-features = false }
# Native fixtures select the independent client matching Testkit.
ic-platform-pocket-ic = { version = "0.19.0", default-features = false }
ic-testkit = "0.81.0"
ic-wire = "0.16.0"
libc = "0.2"
serde_cbor = "0.11.2"
time = { version = "0.3", features = ["formatting"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

missing_const_for_fn = "warn"
must_use_candidate = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
use_self = "warn"

# Workspace-wide documentation/ownership policies cannot use Cargo expectations.
# Human-facing names follow local prose rather than Markdown identifier inference.
doc_markdown = "allow"
# Section-style type docs require a blank line before attributes and declarations.
empty_line_after_doc_comments = "allow"
# Typed error contracts are documented at their owners instead of every wrapper.
missing_errors_doc = "allow"
# Qualified public names remain clear when imported outside their owner module.
module_name_repetitions = "allow"
# Public owned arguments preserve caller ownership even when a body only borrows.
needless_pass_by_value = "allow"
