[workspace]
resolver = "3"
members = [
    "crates/ic-query",
    "crates/ic-query-cli",
    "crates/ic-query-sns",
    "crates/ic-query-topology",
]

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "LICENSE.md"
repository = "https://github.com/dragginzgame/ic-query"
publish = true

[workspace.dependencies]
# Production
clap = "4.6.7"
ic-host-text = "0.77.2"
ic-platform = { version = "0.34.11", default-features = false }
ic-platform-protocol = { version = "0.3.2", default-features = false }
ic-platform-types = { version = "0.21.2", default-features = false }
ic-query-sns = { path = "crates/ic-query-sns", version = "0.105.9" }
ic-query-topology = { path = "crates/ic-query-topology", version = "0.110.10" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.18"

# Production and tests
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false }

# Tests and tooling
toko-tooling = "=0.45.18"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
