[workspace]
members = [
    # Production packages
    "crates/ic-query",
    "crates/ic-query-cli",
    # Tests and tooling only
    "crates/ic-query-testkit",
]
default-members = ["crates/ic-query", "crates/ic-query-cli"]
resolver = "3"

[workspace.package]
version = "0.75.8"
edition = "2024"
rust-version = "1.91.0"
license = "MIT"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]
homepage = "https://github.com/dragginzgame/ic-query"
repository = "https://github.com/dragginzgame/ic-query"

[workspace.dependencies]
# Production dependencies
clap = { version = "4.6.1", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await", "async-await-macro"] }
ic-host-artifacts = { version = "0.69.5", default-features = false }
ic-host-fs = { version = "0.69.5", default-features = false }
ic-host-http = { version = "0.69.5", default-features = false }
ic-host-text = "0.69.5"
ic-host-tools = { version = "0.69.5", default-features = false }
ic-metrics = "0.17.0"
ic-platform = { version = "0.7.2", default-features = false, features = ["candid"] }
ic-query = { path = "crates/ic-query", version = "0.75.8", default-features = false }
prost = "0.14.3"
reqwest = { version = "0.13.4", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = "1.52.3"
url = "2.5.8"

# Tests and tooling only
futures = { version = "0.3", default-features = false }
ic-build = "0.69.6"
ic-host-process = { version = "0.69.5", default-features = false }
ic-testkit = "0.69.5"
ic-wire = "0.7.19"
libc = "0.2"
serde_cbor = "0.11.2"
time = { version = "0.3", features = ["formatting"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# always warn
missing_const_for_fn = "warn"
must_use_candidate = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
use_self = "warn"

# always allow
doc_markdown = "allow"
empty_line_after_doc_comments = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
