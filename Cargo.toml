[workspace]
resolver = "3"
members = ["crates/ic-query-cli", "crates/ic-sns-migration", "crates/ic-topology"]

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
license-file = "LICENSE.md"
repository = "https://github.com/dragginzgame/ic-query"
publish = false

[workspace.dependencies]
clap = "4.6.7"
ic-host-text = "0.76.0"
ic-platform = { version = "0.33.7", default-features = false }
ic-platform-next = { package = "ic-platform", git = "https://github.com/dragginzgame/ic-platform-new", rev = "126479e64adfc13fa21aa217caa19a298bcdc19e", version = "=0.34.0", default-features = false, features = ["certificate-authentication"] }
ic-platform-protocol = { git = "https://github.com/dragginzgame/ic-platform-new", rev = "8ee1e58ce6577054d58fba729546989e8b6fc041", version = "0.1.0", default-features = false, features = ["cloud-engine-response", "registry-settings"] }
ic-platform-types = { version = "0.20.4", default-features = false }
ic-topology = { path = "crates/ic-topology", version = "0.107.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "=2.0.18"
tokio = { version = "1.54.1", default-features = false }
toko-tooling = "=0.44.4"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
redundant_clone = "warn"
needless_pass_by_value = "warn"
wildcard_imports = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
too_many_lines = "allow"
