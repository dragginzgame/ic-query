name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Admit snapshot before preparation
        run: bash vendor/toko-tooling/scripts/ci/verify-toko-tooling-snapshot.sh --consumer . --require-annotations
      - name: Restore pinned tool downloads
        uses: ./vendor/toko-tooling/.github/actions/cache-tool-downloads
      - name: Prepare admission prerequisites
        run: make install-host-tools
      - name: Prepare selected Rust toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      - name: Admit Cargo selection and documentation
        run: make toko-tooling-check doc-links-check
      - name: Prepare shared Rust developer tools
        run: make install-rust-tools
      - name: Check formatting
        run: make fmt-check
      - name: Prepare the pinned secret scanner
        shell: bash
        run: |
          gitleaks_bin="$(bash vendor/toko-tooling/scripts/ci/install-ci-tool.sh gitleaks \
            --install-dir "$RUNNER_TEMP/ic-query-security-bin")"
          printf 'GITLEAKS_BIN=%s\n' "$gitleaks_bin" >> "$GITHUB_ENV"
      - name: Save pinned tool downloads
        uses: ./vendor/toko-tooling/.github/actions/cache-tool-downloads
        with:
          mode: save
      - name: Scan repository history for secrets
        run: '"$GITLEAKS_BIN" git --redact=100 --no-banner --no-color --log-level error'

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # actions/checkout v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Admit snapshot before preparation
        run: bash vendor/toko-tooling/scripts/ci/verify-toko-tooling-snapshot.sh --consumer . --require-annotations
      - name: Prepare admission prerequisites
        run: make install-host-tools
      - name: Prepare selected Rust toolchain
        shell: bash
        run: |
          toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
      - name: Admit Cargo selection
        run: make toko-tooling-check
      - name: Prepare locked dependencies
        run: make fetch-dependencies
      - name: Qualify native scaffold offline
        run: make clippy rustdoc test
