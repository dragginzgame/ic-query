name: CI

env:
  IC_QUERY_MSRV: 1.91.0
  IC_QUERY_INTERNAL_TOOLCHAIN: 1.99.0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  canister:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 25
    steps:
      # actions/checkout v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.IC_QUERY_INTERNAL_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Prepare the selected dependency cache
        run: cargo fetch --locked
      - name: Install repository-local IC tools
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: PATH="/bin:$PATH" make install-ic-tools ic-tools-check
      - name: Select repository-local tools
        shell: bash
        run: printf '%s\n' "$GITHUB_WORKSPACE/.tools/ic/bin" >> "$GITHUB_PATH"
      - name: Lint the canister example
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo clippy -p ic-query --example governance_probe --target wasm32-unknown-unknown --no-default-features --features canister --locked -- -D warnings
      - name: Run local NNS integration smoke
        env:
          CARGO_NET_OFFLINE: 'true'
        run: make canister-smoke
      - name: Build environment-specific bundle
        env:
          CARGO_NET_OFFLINE: 'true'
        run: make canister-bundle
      - name: Retain execution evidence and bundle
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canister-smoke-${{ matrix.host }}
          path: |
            target/canister-smoke/receipt-*/receipt.json
            target/canister-smoke/governance_probe.wasm
            target/canister-smoke/governance-probe.tar.gz
          retention-days: 30

  msrv:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.host }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.IC_QUERY_MSRV }}
      - name: Pin cargo/rustc to MSRV
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=$IC_QUERY_MSRV" >> "$GITHUB_ENV"
      # Swatinem/rust-cache v2
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Prepare the selected dependency cache
        run: cargo fetch --locked
      - name: Check MSRV
        env:
          CARGO_NET_OFFLINE: 'true'
        run: make msrv

  checks:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.host }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          clean: true
          fetch-depth: 0
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.IC_QUERY_INTERNAL_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Pin cargo/rustc to internal toolchain
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=$IC_QUERY_INTERNAL_TOOLCHAIN" >> "$GITHUB_ENV"
      # Swatinem/rust-cache v2
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install development tools
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: PATH="/bin:$PATH" make install-dev
      - name: Select repository-local host tools
        shell: bash
        run: printf '%s\n' "$GITHUB_WORKSPACE/.tools/host/bin" >> "$GITHUB_PATH"
      - name: Select a physical temporary directory
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ic-query-validation"
          validation_tmp="$(cd "$RUNNER_TEMP/ic-query-validation" && pwd -P)"
          printf 'TMPDIR=%s\n' "$validation_tmp" >> "$GITHUB_ENV"
      - name: Prepare the selected dependency cache
        run: cargo fetch --locked
      - name: Select the native system Bash
        if: runner.os == 'macOS'
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          mkdir -p "$RUNNER_TEMP/ic-query-system-bash"
          ln -s /bin/bash "$RUNNER_TEMP/ic-query-system-bash/bash"
          /bin/bash --version
          printf '%s\n' "$RUNNER_TEMP/ic-query-system-bash" >> "$GITHUB_PATH"
      - name: Run complete CI gate
        env:
          CARGO_NET_OFFLINE: 'true'
        run: make ci
      - name: Retain failed validation fixtures and logs
        if: failure()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-failures-${{ matrix.host }}
          path: |
            ${{ runner.temp }}/ic-query-validation/
            target/validation-failures/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
