name: CI

env:
  IC_QUERY_MSRV: 1.91.0
  IC_QUERY_INTERNAL_TOOLCHAIN: 1.99.0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  canister:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-24.04
            icp_target: x86_64-unknown-linux-gnu
            icp_sha256: 03fd43956307f993f2a4b84129cb9e305ffae99e26c65f608c713114607fb7a0
          - host: macos-15
            icp_target: aarch64-apple-darwin
            icp_sha256: 31e27e3b2f679420e88c03f56f66f051c659ba2d99d1a43440f11a2f2f84fdf7
          - host: macos-15-intel
            icp_target: x86_64-apple-darwin
            icp_sha256: 57c9b1fadd22935c2d11fea643963b958725dec683b1860f321c9335de87841a
    runs-on: ${{ matrix.host }}
    timeout-minutes: 25
    steps:
      # actions/checkout v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.IC_QUERY_INTERNAL_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Prepare the selected dependency cache
        run: cargo fetch --locked
      - name: Install verified ICP CLI 1.6.0
        shell: bash
        env:
          ICP_TARGET: ${{ matrix.icp_target }}
          ICP_SHA256: ${{ matrix.icp_sha256 }}
        run: |
          mkdir -p target/icp-tools
          curl --fail --location --retry 3 --output target/icp-tools/icp.tar.xz \
            "https://github.com/dfinity/icp-cli/releases/download/v1.6.0/icp-cli-$ICP_TARGET.tar.xz"
          bash scripts/ci/verify-file-checksum.sh sha256 "$ICP_SHA256" target/icp-tools/icp.tar.xz
          tar -xJf target/icp-tools/icp.tar.xz --strip-components=1 -C target/icp-tools
          test "$(target/icp-tools/icp --version)" = 'icp 1.6.0'
          echo "$GITHUB_WORKSPACE/target/icp-tools" >> "$GITHUB_PATH"
      - name: Check receipt validation
        env:
          CARGO_NET_OFFLINE: 'true'
        run: python3 -m unittest discover -s scripts/canister -p 'test_*.py'
      - name: Lint the canister example
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo clippy -p ic-query --example governance_probe --target wasm32-unknown-unknown --no-default-features --features canister --locked -- -D warnings
      - name: Run local NNS integration smoke
        env:
          CARGO_NET_OFFLINE: 'true'
        run: make canister-smoke
      - name: Build environment-specific bundle
        env:
          CARGO_NET_OFFLINE: 'true'
        run: make canister-bundle
      - name: Retain execution evidence and bundle
        if: always()
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canister-smoke-${{ matrix.host }}
          path: |
            target/canister-smoke/receipt-*/receipt.json
            target/canister-smoke/governance_probe.wasm
            target/canister-smoke/governance-probe.tar.gz
          retention-days: 30

  msrv:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.host }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.IC_QUERY_MSRV }}
      - name: Pin cargo/rustc to MSRV
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=$IC_QUERY_MSRV" >> "$GITHUB_ENV"
      # Swatinem/rust-cache v2
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Prepare the selected dependency cache
        run: cargo fetch --locked
      - name: Check MSRV
        env:
          CARGO_NET_OFFLINE: 'true'
        run: make msrv

  checks:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.host }}
    steps:
      # actions/checkout v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          clean: true
          fetch-depth: 0
      # dtolnay/rust-toolchain v1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.IC_QUERY_INTERNAL_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Pin cargo/rustc to internal toolchain
        shell: bash
        run: echo "RUSTUP_TOOLCHAIN=$IC_QUERY_INTERNAL_TOOLCHAIN" >> "$GITHUB_ENV"
      # Swatinem/rust-cache v2
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - name: Install development tools
        run: make install-dev
      - name: Select a physical temporary directory
        shell: bash
        run: printf 'TMPDIR=%s\n' "$(cd "${TMPDIR:-/tmp}" && pwd -P)" >> "$GITHUB_ENV"
      - name: Prepare the selected dependency cache
        run: cargo fetch --locked
      - name: Select the native system Bash
        if: runner.os == 'macOS'
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          mkdir -p "$RUNNER_TEMP/ic-query-system-bash"
          ln -s /bin/bash "$RUNNER_TEMP/ic-query-system-bash/bash"
          /bin/bash --version
          printf '%s\n' "$RUNNER_TEMP/ic-query-system-bash" >> "$GITHUB_PATH"
      - name: Run complete CI gate
        env:
          CARGO_NET_OFFLINE: 'true'
        run: make ci
