# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v1.6.0/docs/schemas/icp-yaml-schema.json
canisters:
  - name: governance-probe
    build:
      steps:
        - type: script
          command: cargo run --manifest-path ../../Cargo.toml -p ic-query-cli --example governance_smoke --locked --offline -- build-wasm

networks:
  - name: local
    mode: managed
    version: 16.0.0
    nns: true
    gateway:
      bind: 127.0.0.1
      port: 0

environments:
  - name: ic
    network: ic
    canisters: []
  - name: local
    network: local
    canisters: [governance-probe]
  - name: mainnet-smoke
    network: ic
    canisters: [governance-probe]
