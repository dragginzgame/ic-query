[package]
name = "ic-topology"
version = "0.105.3"
description = "Read-only IC infrastructure evidence for Canic topology decisions"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[dependencies]
ic-platform = { workspace = true, features = ["agent", "nns-registry-types"] }
ic-platform-types.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "time"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "test-util"] }

[lints]
workspace = true
