[package]
name = "ic-query-cli"
version = "0.105.3"
description = "CLI adapters for specialist IC query libraries"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[[bin]]
name = "icq"
path = "src/main.rs"

[dependencies]
clap.workspace = true
ic-platform-types.workspace = true
ic-topology.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time"] }

[lints]
workspace = true
