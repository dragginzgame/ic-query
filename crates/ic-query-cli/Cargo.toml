[package]
name = "ic-query-cli"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
description = "Command-line wrapper for read-only Internet Computer metadata queries"
readme = "../../README.md"
homepage.workspace = true
repository.workspace = true
keywords = ["internet-computer", "dfinity", "icp", "nns", "sns"]
categories = ["command-line-utilities"]

[[bin]]
name = "icq"
path = "src/main.rs"

[dependencies]
clap.workspace = true
ic-host-text.workspace = true
ic-platform.workspace = true
ic-query = { workspace = true, features = ["host"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
ic-build.workspace = true
ic-host-artifacts = { workspace = true, features = ["wasm"] }
ic-host-fs = { workspace = true, features = ["test-support"] }
ic-host-process.workspace = true
ic-platform = { workspace = true, features = ["agent"] }
ic-wire.workspace = true
libc.workspace = true
reqwest.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }
time.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }
url.workspace = true

[[example]]
name = "governance_smoke"
path = "examples/governance_smoke/main.rs"

[lints]
workspace = true
