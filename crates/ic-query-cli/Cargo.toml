[package]
name = "ic-query-cli"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
description = "Command-line wrapper for read-only Internet Computer metadata queries"
readme = "../../README.md"
homepage.workspace = true
repository.workspace = true
keywords = ["internet-computer", "dfinity", "icp", "nns", "sns"]
categories = ["command-line-utilities"]

[[bin]]
name = "icq"
path = "src/main.rs"

[dependencies]
candid.workspace = true
clap.workspace = true
ic-query = { workspace = true, features = ["host"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
ic-agent.workspace = true
ic-host-artifacts = { workspace = true, features = ["wasm"] }
ic-host-fs.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
url.workspace = true

[lints]
workspace = true
