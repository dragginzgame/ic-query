[package]
name = "ic-query-sns"
version = "0.105.0"
description = "Selected ICRC balances and SNS neuron evidence for user migration"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[dependencies]
ic-platform = { workspace = true, features = ["native-read"] }
ic-platform-protocol = { workspace = true, features = ["ledger", "sns-neurons"] }
ic-platform-types.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
