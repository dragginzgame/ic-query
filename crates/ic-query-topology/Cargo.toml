[package]
name = "ic-query-topology"
version = "0.110.7"
description = "Read-only IC infrastructure evidence for Canic topology decisions"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[dependencies]
ic-platform = { workspace = true, features = ["native-read"] }
ic-platform-protocol = { workspace = true, features = ["cloud-engine-marketplace", "registry-settings", "registry", "registry-placement"] }
ic-platform-types.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "time"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "test-util"] }
toko-tooling.workspace = true

[lints]
workspace = true
