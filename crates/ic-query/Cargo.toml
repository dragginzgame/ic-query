[package]
name = "ic-query"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
description = "Internet Computer query library for CloudEngine, NNS, SNS, ICRC, system canisters, and public network metadata"
readme = "../../README.md"
documentation = "https://docs.rs/ic-query"
homepage.workspace = true
repository.workspace = true
keywords = ["internet-computer", "dfinity", "icp", "nns", "sns"]
categories = ["command-line-utilities"]

[features]
default = []
canister = ["dep:ic-cdk"]
host = [
    "cloud-engine-host",
    "cmc-host",
    "dashboard-host",
    "ic-state-host",
    "icrc-host",
    "nns-host",
    "sns-host",
]
cloud-engine-host = ["dep:ic-agent", "dep:tokio"]
cmc-host = ["dep:ic-agent", "dep:serde_cbor", "dep:tokio"]
certified-subnet-catalog-host = ["subnet-catalog-host", "dep:serde_cbor"]
dashboard-host = [
    "dep:cap-fs-ext",
    "dep:cap-std",
    "dep:ic-host-artifacts",
    "dep:reqwest",
    "dep:tokio",
]
ic-state-host = ["dep:ic-agent", "dep:tokio"]
icrc-host = [
    "dep:cap-fs-ext",
    "dep:cap-std",
    "dep:futures",
    "dep:ic-agent",
    "dep:ic-host-artifacts",
    "dep:serde_cbor",
    "dep:sha2",
    "dep:tokio",
]
nns-topology-host = ["subnet-catalog-host"]
nns-host = ["nns-topology-host", "certified-subnet-catalog-host"]
sns-host = [
    "dep:cap-fs-ext",
    "dep:cap-std",
    "dep:futures",
    "dep:ic-agent",
    "dep:ic-host-artifacts",
    "dep:tokio",
]
subnet-catalog-host = [
    "dep:cap-fs-ext",
    "dep:cap-std",
    "dep:futures",
    "dep:ic-agent",
    "dep:ic-host-artifacts",
    "dep:prost",
    "dep:sha2",
    "dep:tokio",
]

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-cdk = { workspace = true, optional = true }

[dependencies]
candid.workspace = true
cap-fs-ext = { workspace = true, optional = true }
cap-std = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
ic-agent = { workspace = true, optional = true }
ic-host-artifacts = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
reqwest = { workspace = true, features = [
    "rustls",
], optional = true }
serde.workspace = true
serde_cbor = { workspace = true, optional = true }
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"], optional = true }
unicode-width.workspace = true
url.workspace = true

[[test]]
name = "ic_public_api"

[[test]]
name = "cloud_engine_public_api"

[[test]]
name = "nns_public_api"

[[test]]
name = "sns_public_api"

[[test]]
name = "system_public_api"

[[example]]
name = "governance_probe"
crate-type = ["cdylib"]
required-features = ["canister"]
test = false

[lints]
workspace = true
