[package]
name = "ic-query"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
description = "Internet Computer query library for CloudEngine, NNS, SNS, ICRC, system canisters, and public network metadata"
readme = "../../README.md"
documentation = "https://docs.rs/ic-query"
homepage.workspace = true
repository.workspace = true
keywords = ["internet-computer", "dfinity", "icp", "nns", "sns"]
categories = ["command-line-utilities"]

[dependencies]
cap-fs-ext = { version = "4.0.2", optional = true }
cap-std = { version = "4.0.2", optional = true }
candid.workspace = true
futures = { version = "0.3", optional = true }
ic-agent = { version = "0.49.2", default-features = false, optional = true }
prost = { version = "0.14.3", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
], optional = true }
serde.workspace = true
serde_cbor = { version = "0.11.2", optional = true }
serde_json.workspace = true
sha2 = { version = "0.10.9", optional = true }
thiserror.workspace = true
tokio = { version = "1.52.3", features = ["rt"], optional = true }
unicode-width = "0.2"
url = { version = "2.5.8", optional = true }

[features]
default = []
host = [
    "cloud-engine-host",
    "cmc-host",
    "dashboard-host",
    "ic-state-host",
    "icrc-host",
    "nns-host",
    "sns-host",
]
cloud-engine-host = [
    "dep:ic-agent",
    "dep:tokio",
    "dep:url",
]
cmc-host = [
    "dep:ic-agent",
    "dep:serde_cbor",
    "dep:tokio",
    "dep:url",
]
certified-subnet-catalog-host = [
    "subnet-catalog-host",
    "dep:serde_cbor",
]
dashboard-host = [
    "dep:cap-fs-ext",
    "dep:cap-std",
    "dep:reqwest",
    "dep:tokio",
    "dep:url",
]
ic-state-host = [
    "dep:ic-agent",
    "dep:tokio",
    "dep:url",
]
icrc-host = [
    "dep:cap-fs-ext",
    "dep:cap-std",
    "dep:futures",
    "dep:ic-agent",
    "dep:serde_cbor",
    "dep:sha2",
    "dep:tokio",
    "dep:url",
]
nns-topology-host = ["subnet-catalog-host"]
nns-host = ["nns-topology-host", "certified-subnet-catalog-host"]
sns-host = [
    "dep:cap-fs-ext",
    "dep:cap-std",
    "dep:futures",
    "dep:ic-agent",
    "dep:tokio",
    "dep:url",
]
subnet-catalog-host = [
    "dep:cap-fs-ext",
    "dep:cap-std",
    "dep:futures",
    "dep:ic-agent",
    "dep:prost",
    "dep:sha2",
    "dep:tokio",
    "dep:url",
]

[[test]]
name = "ic_public_api"

[[test]]
name = "cloud_engine_public_api"

[[test]]
name = "nns_public_api"

[[test]]
name = "sns_public_api"

[[test]]
name = "system_public_api"

[lints]
workspace = true
