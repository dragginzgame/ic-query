[package]
name = "ic-query"
edition.workspace = true
rust-version.workspace = true
version = "0.93.1"
license.workspace = true
authors.workspace = true
description = "Internet Computer query library for CloudEngine, NNS, SNS, ICRC, system canisters, and public network metadata"
readme = "../../README.md"
documentation = "https://docs.rs/ic-query"
homepage.workspace = true
repository.workspace = true
keywords = ["internet-computer", "dfinity", "icp", "nns", "sns"]
categories = ["command-line-utilities"]

[package.metadata.shared-tooling.loc.paths]
"tests/fixtures/governance_probe.rs" = "tests"

[features]
default = []
ledger-evidence-host = ["certificate-host", "ic-host-tools/ledger-evidence"]
certificate-host = [
    "ic-platform/agent",
    "ic-platform/certification-cbor",
    "ic-platform/certification",
]
canister = ["ic-platform/cdk"]
host = [
    "cloud-engine-host",
    "cmc-host",
    "dashboard-host",
    "ic-state-host",
    "icrc-host",
    "nns-host",
    "sns-host",
]
cloud-engine-host = ["ic-host-tools/agent", "ic-platform/agent"]
cmc-host = [
    "ic-host-tools/agent",
    "certificate-host",
    "ic-platform/agent",
    "ic-platform/cmc-types",
]
dashboard-host = ["dep:ic-host-artifacts", "dep:ic-host-fs", "dep:ic-host-http", "dep:reqwest"]
ic-state-host = [
    "ic-host-tools/agent",
    "ic-host-tools/encoding",
    "ic-platform/agent",
    "ic-platform/certification",
]
icrc-host = [
    "ic-host-tools/agent",
    "certificate-host",
    "dep:futures-util",
    "ic-platform/agent",
    "dep:ic-host-artifacts",
    "dep:ic-host-fs",
    "ic-platform/icrc-ledger-types",
]
nns-topology-host = ["subnet-catalog-host"]
nns-host = ["nns-topology-host", "certificate-host", "ic-host-tools/encoding"]
sns-host = [
    "ic-host-tools/agent",
    "ic-platform/agent",
    "dep:ic-host-artifacts",
    "dep:ic-host-fs",
]
subnet-catalog-host = [
    "ic-host-tools/agent",
    "ic-host-tools/registry",
    "dep:futures-util",
    "ic-platform/agent",
    "dep:ic-host-artifacts",
    "dep:ic-host-fs",
    "dep:prost",
    "dep:tokio",
]

[dependencies]
futures-util = { workspace = true, optional = true }
ic-host-artifacts = { workspace = true, optional = true }
ic-host-fs = { workspace = true, optional = true, features = ["capability"] }
ic-host-http = { workspace = true, optional = true }
ic-host-text.workspace = true
ic-host-tools = { workspace = true, optional = true }
ic-platform.workspace = true
prost = { workspace = true, optional = true }
reqwest = { workspace = true, features = [
    "rustls",
], optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"], optional = true }
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
futures = { workspace = true, features = ["executor"] }
ic-host-artifacts = { workspace = true, features = ["wasm"] }
ic-host-fs = { workspace = true, features = ["test-support"] }
ic-host-process = { workspace = true, features = ["test-support"] }
ic-platform = { workspace = true, features = ["ic-protocol-fixtures"] }
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
ic-wire.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[[example]]
name = "governance_probe"
path = "tests/fixtures/governance_probe.rs"
crate-type = ["cdylib"]
required-features = ["canister"]
test = false

[lints]
workspace = true
