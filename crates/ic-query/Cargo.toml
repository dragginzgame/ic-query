[package]
name = "ic-query"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
description = "Internet Computer query library for NNS, SNS, ICRC, and related public network metadata"
readme = "../../README.md"
documentation = "https://docs.rs/ic-query"
homepage.workspace = true
repository.workspace = true
keywords = ["internet-computer", "dfinity", "icp", "nns", "sns"]
categories = ["command-line-utilities"]

[dependencies]
candid.workspace = true
futures = { version = "0.3", optional = true }
ic-agent = { version = "0.48.1", default-features = false, optional = true }
prost = { version = "0.14.3", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.10.9", optional = true }
thiserror.workspace = true
tokio = { version = "1.52.3", features = ["rt"], optional = true }
unicode-width = "0.2"

[features]
default = []
host = ["dep:futures", "dep:ic-agent", "dep:prost", "dep:sha2", "dep:tokio"]

[[test]]
name = "nns_public_api"

[[test]]
name = "sns_public_api"

[lints]
workspace = true
