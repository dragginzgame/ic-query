[package]
name = "ic-query"
version = "0.104.3"
description = "Feature-selected IC topology and SNS query libraries"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
default = []
sns = ["dep:ic-query-sns"]
topology = ["dep:ic-query-topology"]

[dependencies]
ic-query-sns = { workspace = true, optional = true }
ic-query-topology = { workspace = true, optional = true }

[lints]
workspace = true
