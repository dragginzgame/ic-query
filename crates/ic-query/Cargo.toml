[package]
name = "ic-query"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
description = "Internet Computer query library for CloudEngine, NNS, SNS, ICRC, system canisters, and public network metadata"
readme = "../../README.md"
documentation = "https://docs.rs/ic-query"
homepage.workspace = true
repository.workspace = true
keywords = ["internet-computer", "dfinity", "icp", "nns", "sns"]
categories = ["command-line-utilities"]

[features]
default = []
ledger-evidence-host = ["certificate-host", "ic-platform/icrc-ledger-types"]
certificate-host = ["ic-platform/agent", "dep:ic-host-tools", "ic-platform/certification"]
canister = ["ic-platform/cdk"]
host = [
    "cloud-engine-host",
    "cmc-host",
    "dashboard-host",
    "ic-state-host",
    "icrc-host",
    "nns-host",
    "sns-host",
]
cloud-engine-host = ["ic-platform/agent", "dep:tokio"]
cmc-host = ["certificate-host", "ic-platform/agent", "dep:tokio"]
certified-subnet-catalog-host = ["certificate-host", "subnet-catalog-host", "dep:serde_cbor"]
dashboard-host = [
    "dep:cap-fs-ext",
    "dep:cap-std",
    "dep:ic-host-artifacts",
    "dep:ic-host-fs",
    "dep:reqwest",
    "dep:tokio",
]
ic-state-host = ["ic-platform/agent", "dep:tokio", "ic-platform/certification"]
icrc-host = [
    "certificate-host",
    "dep:cap-fs-ext",
    "dep:cap-std",
    "dep:futures",
    "ic-platform/agent",
    "dep:ic-host-artifacts",
    "dep:ic-host-fs",
    "ic-platform/icrc-ledger-types",
    "dep:sha2",
    "dep:tokio",
]
nns-topology-host = ["subnet-catalog-host"]
nns-host = ["nns-topology-host", "certified-subnet-catalog-host"]
sns-host = [
    "dep:cap-fs-ext",
    "dep:cap-std",
    "dep:futures",
    "ic-platform/agent",
    "dep:ic-host-artifacts",
    "dep:ic-host-fs",
    "ic-platform/icrc-ledger-types",
    "dep:tokio",
]
subnet-catalog-host = [
    "dep:cap-fs-ext",
    "dep:cap-std",
    "dep:futures",
    "ic-platform/agent",
    "dep:ic-host-artifacts",
    "dep:ic-host-fs",
    "dep:prost",
    "dep:sha2",
    "dep:tokio",
]

[dependencies]
cap-fs-ext = { workspace = true, optional = true }
cap-std = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
ic-host-artifacts = { workspace = true, optional = true }
ic-host-fs = { workspace = true, optional = true }
ic-host-text.workspace = true
ic-host-tools = { workspace = true, optional = true, features = ["certificate"] }
ic-metrics.workspace = true
ic-platform.workspace = true
prost = { workspace = true, optional = true }
reqwest = { workspace = true, features = [
    "rustls",
], optional = true }
serde.workspace = true
serde_cbor = { workspace = true, optional = true }
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"], optional = true }
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
ic-host-fs = { workspace = true, features = ["test-support"] }
ic-host-process = { workspace = true, features = ["test-support"] }
ic-testkit.workspace = true
tokio = { workspace = true, features = ["net"] }
wat.workspace = true

[dev-dependencies]
ciborium.workspace = true
serde_cbor.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[[test]]
name = "ic_public_api"

[[test]]
name = "cloud_engine_public_api"

[[test]]
name = "nns_public_api"

[[test]]
name = "sns_public_api"

[[test]]
name = "system_public_api"

[[example]]
name = "governance_probe"
crate-type = ["cdylib"]
required-features = ["canister"]
test = false

[lints]
workspace = true
